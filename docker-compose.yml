services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sdfs
      POSTGRES_PASSWORD: sdfs
      POSTGRES_DB: sdfs
    ports:
      - "5432:5432"
    volumes:
      - sdfs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdfs"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sdfs-postgres:
